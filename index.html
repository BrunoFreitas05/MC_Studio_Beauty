<style>
  /* ── TOKENS ── */
  :root {
    --creme:    #f5f0e8;
    --creme-2:  #ede5d8;
    --ouro:     #b8973e;
    --ouro-cl:  #d4af5a;
    --ouro-bg:  #f5f0e8;
    --texto:    #2c2118;
    --texto-2:  #7a6045;
    --branco:   #ffffff;
    --borda:    #ddd0b8;
    --radius:   14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: var(--creme);
    color: var(--texto);
    min-height: 100vh;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ── HERO ── */
  .hero {
    background: var(--branco);
    padding: 40px 24px 28px;
    text-align: center;
    border-bottom: 1px solid var(--borda);
    position: relative;
  }
  .hero::after {
    content: '';
    display: block;
    width: 56px;
    height: 1.5px;
    background: var(--ouro);
    margin: 16px auto 0;
  }
  .logo-ring-wrap {
    position: relative;
    width: 80px;
    margin: 0 auto 16px;
  }
  .logo-ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid var(--ouro);
    background: var(--creme);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body.modo-admin .logo-ring { cursor: pointer; }
  .logo-ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .logo-ring .initials {
    font-size: 22px;
    font-weight: 600;
    color: var(--ouro);
    letter-spacing: 0.04em;
    font-family: 'Georgia', serif;
  }
  .perfil-remove-btn {
    position: absolute;
    top: -3px; right: -3px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(28,18,8,0.75);
    color: #fff;
    border: 2px solid var(--branco);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .hero h1 {
    font-size: 22px;
    font-weight: 400;
    color: var(--texto);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .hero-sub {
    font-family: Arial, sans-serif;
    font-size: 10px;
    color: var(--ouro);
    letter-spacing: 0.16em;
    margin-top: 5px;
  }
  .hero-edit-btn {
    position: absolute;
    top: 50px; right: 14px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--creme);
    border: 1px solid var(--borda);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  body.modo-admin .hero-edit-btn { display: flex; }
  .hero-edit-btn svg { width: 13px; height: 13px; stroke: var(--ouro); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── DOCK ── */
  .dock-wrap {
    position: relative;
    background: var(--branco);
    border-bottom: 1px solid var(--borda);
  }
  .dock-dots-btn {
    position: absolute;
    top: 10px; right: 10px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--creme);
    border: 1px solid var(--borda);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  .dock-dots-btn svg { width: 14px; height: 14px; }
  .dock-dots-btn svg circle { fill: var(--ouro); }
  .dock {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 20px 16px;
  }
  .dock-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    flex: 1;
    max-width: 72px;
  }
  .dock-ico {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--creme);
    border: 1px solid var(--borda);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.15s, border-color 0.15s;
  }
  .dock-item:hover .dock-ico {
    background: var(--ouro);
    border-color: var(--ouro);
  }
  .dock-item:hover .dock-ico svg { stroke: #fff; }
  .dock-ico svg { width: 22px; height: 22px; stroke: var(--ouro); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dock-ico img { width: 100%; height: 100%; object-fit: cover; }
  .dock-label {
    font-family: Arial, sans-serif;
    font-size: 9px;
    color: var(--texto-2);
    text-align: center;
    letter-spacing: 0.04em;
  }

  /* ── SECTION LABEL ── */
  .sec-label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 24px 20px 16px;
  }
  .sec-label hr { flex: 1; border: none; border-top: 1px solid var(--borda); }
  .sec-label span {
    font-family: Arial, sans-serif;
    font-size: 10px;
    color: var(--ouro);
    letter-spacing: 0.16em;
  }

  /* ── BARRA ADMIN DO PORTFÓLIO ── */
  .portfolio-admin-bar { padding: 0 16px 16px; }

  .btn-novo {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: 1.5px dashed var(--ouro);
    color: var(--ouro);
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-novo:hover { background: var(--creme); }

  /* ── GRID ── */
  .portfolio-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 16px 32px;
  }
  .pcard {
    position: relative;
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .pcard:hover { transform: translateY(-2px); }
  .pcard-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--creme-2);
    position: relative;
    overflow: hidden;
  }
  .pcard-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .pcard-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(28,18,8,0.75));
    padding: 18px 8px 8px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }
  .pcard-preco-duracao {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pcard-price {
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--ouro-cl);
    letter-spacing: 0.02em;
  }
  .pcard-duracao {

// ── SINCRONIZAÇÃO EM TEMPO REAL ──
onSnapshot(SITE_DOC, snap => {
  docExisteNoServidor = snap.exists();
  if (snap.exists()) {
    const d = snap.data();
    servicos = d.servicos || getServicosPadrao();
    links = d.links || getLinksPadrao();
    configTexto = d.configTexto || getConfigTextoPadrao();
    perfilFotoUrl = d.perfilFoto || null;
  }
  renderPerfil();
  renderTextos();
  renderDock();
  renderGrid();
  if (document.getElementById("modalGaleria").classList.contains("aberto")) renderModalGaleria();
  verificarSeed();
}, err => console.error("Erro ao sincronizar dados do site:", err));

function verificarSeed() {
  if (modoAdmin && !docExisteNoServidor && !jaTentouSeed) {
    jaTentouSeed = true;
    setDoc(SITE_DOC, { servicos, links, configTexto, perfilFoto: perfilFotoUrl })
      .catch(e => console.error("Erro ao inicializar dados no Firestore:", e));
  }
}

function renderPerfil() {
  const img = document.getElementById("fotoPerfilImg");
  const iniciais = document.getElementById("perfilIniciais");
  if (perfilFotoUrl) {

function renderTextos() {

function renderDock() {

// ── MODO ADMIN / LOGIN GOOGLE ──
function aplicarModoAdmin() {
  document.body.classList.toggle("modo-admin", modoAdmin);

  const btnAdmin = document.getElementById("btnAdmin");
  btnAdmin.classList.toggle("ativo", modoAdmin);
  btnAdmin.title = modoAdmin ? "Sair da edição" : "Admin";

  document.getElementById("portfolioAdminBar").style.display = modoAdmin ? "block" : "none";
  document.getElementById("btnRemoverFotoPerfil").style.display = (modoAdmin && perfilFotoUrl) ? "flex" : "none";
  document.getElementById("btnGerenciarLinks").style.display = modoAdmin ? "flex" : "none";

  if (!modoAdmin) fecharMiniModal();

  renderGrid();
  if (document.getElementById("modalGaleria").classList.contains("aberto")) {
    renderModalGaleria();
  }
}

onAuthStateChanged(auth, user => {
  usuarioAtual = user;
  modoAdmin = !!(user && user.email && user.emailVerified && EMAILS_PERMITIDOS.includes(user.email));
  aplicarModoAdmin();
  verificarSeed();
});

document.getElementById("btnAdmin").addEventListener("click", () => {
  if (modoAdmin) {
    signOut(auth);
  } else {
    abrirModalSenha();
  }
});

function abrirModalSenha() {
  const html = `
    <h3>Área exclusiva</h3>
    <p style="font-family:Arial,sans-serif;font-size:11px;color:var(--texto-2);margin-bottom:16px;">Entre com a conta Google autorizada para editar o site.</p>
    <button class="btn-salvar" id="btnEntrarGoogle">ENTRAR COM GOOGLE</button>
    <div class="erro-msg" id="erroGoogleLogin">Essa conta Google não tem permissão para editar este site.</div>
    <button class="btn-fechar-admin" id="btnCancelarSenha">Cancelar</button>
  `;
  abrirMiniModal(html);
  document.getElementById("btnCancelarSenha").addEventListener("click", fecharMiniModal);
  document.getElementById("btnEntrarGoogle").addEventListener("click", fazerLoginGoogle);
}

async function fazerLoginGoogle() {
  const btn = document.getElementById("btnEntrarGoogle");
  const erro = document.getElementById("erroGoogleLogin");
  erro.style.display = "none";
  btn.disabled = true;
  btn.textContent = "ENTRANDO...";
  try {
    const provider = new GoogleAuthProvider();
    const resultado = await signInWithPopup(auth, provider);
    const email = resultado.user.email;
    if (!EMAILS_PERMITIDOS.includes(email)) {
      await signOut(auth);
      erro.style.display = "block";
      btn.disabled = false;
      btn.textContent = "ENTRAR COM GOOGLE";
      return;
    }
    fecharMiniModal();
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = "ENTRAR COM GOOGLE";
  }
}

function abrirMiniModal(innerHtml) {
  document.getElementById("miniModalBox").innerHTML = innerHtml;
  document.getElementById("miniModalOverlay").classList.add("aberto");
  document.body.style.overflow = "hidden";
}
function fecharMiniModal() {
  document.getElementById("miniModalOverlay").classList.remove("aberto");
  document.getElementById("miniModalBox").innerHTML = "";
  if (!document.getElementById("modalGaleria").classList.contains("aberto")) {
    document.body.style.overflow = "";

document.getElementById("miniModalOverlay").addEventListener("click", e => {

});

function fecharTodosDropdowns() {
  document.querySelectorAll(".dots-menu.aberto").forEach(m => m.classList.remove("aberto"));
}
document.addEventListener("click", fecharTodosDropdowns);

function renderGrid() {
  const grid = document.getElementById("portfolioGrid");
  grid.innerHTML = "";

  if (servicos.length === 0) {
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;font-family:Arial,sans-serif;font-size:12px;color:var(--texto-2);padding:20px 0;">Em breve, novos trabalhos.</p>`;
    return;
  }

  servicos.forEach(serv => {
    const card = document.createElement("div");
    card.className = "pcard";
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", `Ver fotos de ${serv.nome}`);

    const precoDuracaoHtml = `
      <div class="pcard-preco-duracao">
        <span class="pcard-price">R$ ${serv.preco}</span>
        ${serv.duracao ? `<span class="pcard-duracao">| ${serv.duracao}</span>` : ''}
      </div>`;

    const imgHtml = serv.capa
      ? `<div class="pcard-img"><img src="${serv.capa}" alt="${serv.nome}" loading="lazy">
          <div class="pcard-overlay">${precoDuracaoHtml}</div>
         </div>`
      : `<div class="pcard-img-placeholder">
          ${svgImgVazia}
          <div class="pcard-overlay">${precoDuracaoHtml}</div>
         </div>`;

    const dotsHtml = modoAdmin ? `
      <div class="pcard-dots-wrap">
        <button class="pcard-dots-btn" aria-label="Opções do serviço" title="Opções">${svgDotsBranco}</button>
        <div class="dots-menu">
          <button data-acao="renomear">Editar nome</button>
          <button data-acao="duracao">Editar duração</button>
          <button data-acao="excluir" class="perigo">Excluir serviço</button>
        </div>
      </div>` : '';

    card.innerHTML = `
      ${dotsHtml}
      ${imgHtml}
      <div class="pcard-body">
        <p class="pcard-title">${serv.nome}</p>
        <p class="pcard-more">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          ver mais fotos
        </p>
      </div>`;

    card.addEventListener("click", () => abrirGaleria(serv));
    card.addEventListener("keydown", e => { if (e.key === "Enter") abrirGaleria(serv); });

    if (modoAdmin) {
      const dotsBtn = card.querySelector(".pcard-dots-btn");
      const dotsMenu = card.querySelector(".dots-menu");

      dotsBtn.addEventListener("click", e => {
        e.stopPropagation();
        const jaAberto = dotsMenu.classList.contains("aberto");
        fecharTodosDropdowns();
        if (!jaAberto) dotsMenu.classList.add("aberto");
      });

      card.querySelector('[data-acao="renomear"]').addEventListener("click", e => {
        e.stopPropagation();
        dotsMenu.classList.remove("aberto");
        iniciarEdicaoNomeCard(card, serv);
      });

      card.querySelector('[data-acao="duracao"]').addEventListener("click", e => {
        e.stopPropagation();
        dotsMenu.classList.remove("aberto");
        abrirModalEditarDuracao(serv);
      });

      card.querySelector('[data-acao="excluir"]').addEventListener("click", async e => {
        e.stopPropagation();
        dotsMenu.classList.remove("aberto");
        if (confirm(`Excluir o serviço "${serv.nome}"? Essa ação não pode ser desfeita.`)) {
          const fotosParaRemover = serv.fotos || [];
          servicos = servicos.filter(s => s.id !== serv.id);
          await salvarServicos();
          renderGrid();
          fotosParaRemover.forEach(removerFotoSilenciosamente);
        }
      });
    }

    grid.appendChild(card);
  });
}

function iniciarEdicaoNomeCard(card, serv) {
  const body = card.querySelector(".pcard-body");
  body.innerHTML = `
    <input type="text" class="edit-nome-input" value="${serv.nome.replace(/"/g, '&quot;')}">
    <div class="edit-nome-acoes">
      <button class="link-btn salvar-nome">Salvar</button>
      <button class="link-btn cancelar-nome">Cancelar</button>
    </div>
  `;
  body.addEventListener("click", e => e.stopPropagation());
  const input = body.querySelector(".edit-nome-input");
  input.focus();
  input.select();

  const salvar = async () => {
    const novoNome = input.value.trim();
    if (novoNome) {
      serv.nome = novoNome;
      await salvarServicos();
    }
    renderGrid();
  };

  body.querySelector(".salvar-nome").addEventListener("click", e => { e.stopPropagation(); salvar(); });
  body.querySelector(".cancelar-nome").addEventListener("click", e => { e.stopPropagation(); renderGrid(); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") salvar();
    if (e.key === "Escape") renderGrid();
  });
}

function abrirModalEditarDuracao(serv) {
  const html = `
    <h3>Editar duração</h3>
    <div class="field-group"><label>DURAÇÃO</label><input type="text" id="editDuracao" value="${(serv.duracao || '').replace(/"/g, '&quot;')}" placeholder="Ex: 60 min"></div>
    <button class="btn-salvar" id="btnSalvarDuracao">SALVAR</button>
    <button class="btn-fechar-admin" id="btnCancelarDuracao">Cancelar</button>
  `;
  abrirMiniModal(html);
  document.getElementById("btnCancelarDuracao").addEventListener("click", fecharMiniModal);
  document.getElementById("btnSalvarDuracao").addEventListener("click", async () => {
    serv.duracao = document.getElementById("editDuracao").value.trim();
    await salvarServicos();
    renderGrid();
    fecharMiniModal();
  });
}

document.getElementById("btnNovoServico").addEventListener("click", abrirModalNovoServico);

function abrirModalNovoServico() {
  const html = `
    <h3>Novo serviço</h3>
    <div class="field-group"><label>NOME DO SERVIÇO</label><input type="text" id="novoServNome" placeholder="Ex: Alongamento em fibra"></div>
    <div class="field-group"><label>VALOR (R$)</label><input type="text" id="novoServPreco" placeholder="Ex: 180"></div>
    <div class="field-group"><label>DURAÇÃO</label><input type="text" id="novoServDuracao" placeholder="Ex: 60 min"></div>
    <div class="field-group"><label>DESCRIÇÃO</label><textarea id="novoServDesc" placeholder="Descreva o serviço..."></textarea></div>
    <div class="field-group"><label>FOTO DE CAPA</label><input type="file" id="novoServCapa" accept="image/*"></div>
    <div class="erro-msg" id="erroNovoServ">Preencha ao menos nome e valor.</div>
    <button class="btn-salvar" id="btnSalvarNovoServ">ADICIONAR SERVIÇO</button>
    <button class="btn-fechar-admin" id="btnCancelarNovoServ">Cancelar</button>
  `;
  abrirMiniModal(html);
  document.getElementById("btnCancelarNovoServ").addEventListener("click", fecharMiniModal);
  document.getElementById("btnSalvarNovoServ").addEventListener("click", salvarNovoServico);
}

async function salvarNovoServico() {
  const nome = document.getElementById("novoServNome").value.trim();
  const preco = document.getElementById("novoServPreco").value.trim();
  const duracao = document.getElementById("novoServDuracao").value.trim();
  const desc = document.getElementById("novoServDesc").value.trim();
  const file = document.getElementById("novoServCapa").files[0];
  const erro = document.getElementById("erroNovoServ");
  const btn = document.getElementById("btnSalvarNovoServ");

  if (!nome || !preco) {
    erro.style.display = "block";
    return;
  }
  erro.style.display = "none";

  const novoId = uid();
  btn.disabled = true;
  btn.textContent = file ? "ENVIANDO FOTO..." : "SALVANDO...";

  try {
    let capaUrl = null;
    if (file) capaUrl = await subirFoto(file, `servicos/${novoId}/${uid()}.jpg`);
    servicos.push({ id: novoId, nome, preco, duracao, desc, capa: capaUrl, fotos: capaUrl ? [capaUrl] : [] });
    await salvarServicos();
    renderGrid();
    fecharMiniModal();
  } catch (e) {
    console.error(e);
    erro.textContent = "Erro ao salvar. Verifique sua internet e tente novamente.";
    erro.style.display = "block";
    btn.disabled = false;
    btn.textContent = "ADICIONAR SERVIÇO";
  }
}

// ── MODAL GALERIA (público + controles admin) ──
function abrirGaleria(serv) {
  servicoGaleriaAberta = serv.id;
  renderModalGaleria();
  const overlay = document.getElementById("modalGaleria");
  overlay.classList.add("aberto");
  document.body.style.overflow = "hidden";
}

function renderModalGaleria() {
  const serv = servicos.find(s => s.id === servicoGaleriaAberta);
  if (!serv) return;

  document.getElementById("modalTitulo").textContent = serv.nome;
  document.getElementById("modalPreco").innerHTML = `R$ ${serv.preco}` + (serv.duracao ? ` <span class="modal-duracao">| ${serv.duracao}</span>` : '');
  document.getElementById("modalDesc").textContent = serv.desc || "";
  document.getElementById("modalAdminBar").style.display = modoAdmin ? "block" : "none";

  const grid = document.getElementById("modalFotos");
  grid.innerHTML = "";
  const fotos = serv.fotos || [];

  if (fotos.length === 0) {
    grid.innerHTML = modoAdmin
      ? `<p class="admin-vazio" style="grid-column:1/-1;">Nenhuma foto ainda. Use "Adicionar fotos" acima.</p>`
      : `<div class="modal-foto">${svgImgVazia}</div>`;
    return;
  }

  fotos.forEach((foto, idx) => {
    const div = document.createElement("div");
    div.className = "modal-foto";
    div.innerHTML = `<img src="${foto}" alt="${serv.nome}" loading="lazy">`;
    if (modoAdmin) {
      div.innerHTML += `
        <div class="modal-foto-admin">
          ${serv.capa === foto ? '<span class="capa-tag">CAPA</span>' : `<button class="foto-acao-btn" data-acao="capa" data-idx="${idx}">Definir capa</button>`}
          <div class="foto-admin-acoes">
            <button class="foto-editar-btn" data-idx="${idx}" aria-label="Editar foto" title="Trocar esta foto">${svgLapisBranco}</button>
            <button class="foto-remove-btn" data-idx="${idx}" aria-label="Remover foto">×</button>
          </div>
        </div>
        <input type="file" class="foto-editar-input" accept="image/*" data-idx="${idx}" style="display:none">`;
    }
    grid.appendChild(div);
  });

  if (modoAdmin) {
    grid.querySelectorAll('[data-acao="capa"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        const idx = Number(btn.dataset.idx);
        serv.capa = serv.fotos[idx];
        await salvarServicos();
        renderModalGaleria();
        renderGrid();
      });
    });
    grid.querySelectorAll(".foto-editar-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.idx);
        grid.querySelector(`.foto-editar-input[data-idx="${idx}"]`).click();
      });
    });
    grid.querySelectorAll(".foto-editar-input").forEach(input => {
      input.addEventListener("change", async () => {
        const idx = Number(input.dataset.idx);
        const file = input.files[0];
        if (!file) return;
        try {
          const antiga = serv.fotos[idx];
          const nova = await subirFoto(file, `servicos/${serv.id}/${uid()}.jpg`);
          serv.fotos[idx] = nova;
          if (serv.capa === antiga) serv.capa = nova;
          await salvarServicos();
          renderModalGaleria();
          renderGrid();
          removerFotoSilenciosamente(antiga);
        } catch (e) {
          console.error(e);
          alert("Erro ao trocar a foto. Tente novamente.");
        }
      });
    });
    grid.querySelectorAll(".foto-remove-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const idx = Number(btn.dataset.idx);
        if (!confirm("Remover esta foto?")) return;
        const removida = serv.fotos[idx];
        serv.fotos.splice(idx, 1);
        if (serv.capa === removida) serv.capa = serv.fotos[0] || null;
        await salvarServicos();
        renderModalGaleria();
        renderGrid();
        removerFotoSilenciosamente(removida);
      });
    });
  }
}

document.getElementById("modalAddFotos").addEventListener("change", async () => {
  const serv = servicos.find(s => s.id === servicoGaleriaAberta);
  const input = document.getElementById("modalAddFotos");
  const label = document.querySelector('label[for="modalAddFotos"]');
  if (!serv || !input.files.length) return;

  const files = Array.from(input.files);
  const textoOriginal = label.textContent;
  label.textContent = "Enviando...";

  try {
    for (const file of files) {
      const url = await subirFoto(file, `servicos/${serv.id}/${uid()}.jpg`);
      serv.fotos = serv.fotos || [];
      serv.fotos.push(url);
      if (!serv.capa) serv.capa = url;
    }
    await salvarServicos();
    renderModalGaleria();
    renderGrid();
  } catch (e) {
    console.error(e);
    alert("Erro ao enviar uma ou mais fotos. Tente novamente.");
  } finally {
    label.textContent = textoOriginal;
    input.value = "";
  }
});

document.getElementById("btnFecharModal").addEventListener("click", () => {
  document.getElementById("modalGaleria").classList.remove("aberto");
  document.body.style.overflow = "";
});
document.getElementById("modalGaleria").addEventListener("click", e => {

    e.currentTarget.classList.remove("aberto");
    document.body.style.overflow = "";
  }
});

// ══════════════════ PERFIL / LINKS ══════════════════

document.getElementById("logoRing").addEventListener("click", () => {
  if (!modoAdmin) return;
  document.getElementById("inputFotoPerfil").click();
});

document.getElementById("inputFotoPerfil").addEventListener("change", async () => {
  const input = document.getElementById("inputFotoPerfil");
  const file = input.files[0];
  if (!file) return;
  input.value = "";
  try {
    const antiga = perfilFotoUrl;
    const nova = await subirFoto(file, `perfil/${uid()}.jpg`);
    await salvarPerfilFotoUrl(nova);
    renderPerfil();
    aplicarModoAdmin();
    removerFotoSilenciosamente(antiga);
  } catch (e) {
    console.error(e);
    alert("Erro ao enviar a foto. Tente novamente.");
  }
});

document.getElementById("btnRemoverFotoPerfil").addEventListener("click", async e => {
  e.stopPropagation();
  if (!confirm("Remover a foto de perfil e voltar para as iniciais?")) return;
  const antiga = perfilFotoUrl;
  await salvarPerfilFotoUrl(null);
  renderPerfil();
  aplicarModoAdmin();
  removerFotoSilenciosamente(antiga);
});

document.getElementById("btnEditarHero").addEventListener("click", () => {
  const html = `
    <h3>Editar nome</h3>
    <div class="field-group"><label>NOME</label><input type="text" id="editHeroNome" value="${configTexto.nome.replace(/"/g, '&quot;')}"></div>
    <div class="field-group"><label>SUBTÍTULO</label><input type="text" id="editHeroSubtitulo" value="${configTexto.subtitulo.replace(/"/g, '&quot;')}"></div>
    <div class="erro-msg" id="erroHeroForm">Preencha o nome.</div>
    <button class="btn-salvar" id="btnSalvarHero">SALVAR</button>
    <button class="btn-fechar-admin" id="btnCancelarHero">Cancelar</button>
  `;
  abrirMiniModal(html);
  document.getElementById("btnCancelarHero").addEventListener("click", fecharMiniModal);
  document.getElementById("btnSalvarHero").addEventListener("click", async () => {
    const nome = document.getElementById("editHeroNome").value.trim();
    const subtitulo = document.getElementById("editHeroSubtitulo").value.trim();
    const erro = document.getElementById("erroHeroForm");
    if (!nome) { erro.style.display = "block"; return; }
    erro.style.display = "none";
    configTexto.nome = nome;
    configTexto.subtitulo = subtitulo;
    await salvarConfigTexto();
    renderTextos();
    fecharMiniModal();
  });
});

document.getElementById("btnEditarRodape").addEventListener("click", () => {
  abrirModalEditarRodape(configTexto.rodape.slice());
});

function abrirModalEditarRodape(draft) {
  const camposHtml = draft.map((valor, idx) => `
    <div class="field-group">
      <label>CAMPO ${idx + 1}</label>
      <div class="campo-rodape-row">
        <input type="text" class="campo-rodape-input" value="${(valor || '').replace(/"/g, '&quot;')}">
        ${draft.length > 1 ? `<button type="button" class="icon-btn perigo remover-campo-btn" data-idx="${idx}" title="Remover campo" aria-label="Remover campo">${svgLixeira}</button>` : ''}
      </div>
    </div>
  `).join("");

  const podeAdicionar = draft.length < RODAPE_CAMPOS_MAX;

  const html = `
    <h3>Editar rodapé</h3>
    <div id="camposRodapeWrap">${camposHtml}</div>
    ${podeAdicionar ? `<button type="button" class="btn-novo" id="btnAdicionarCampoRodape">+ Adicionar campo</button>` : ''}
    <button class="btn-salvar" id="btnSalvarRodape">SALVAR</button>
    <button class="btn-fechar-admin" id="btnCancelarRodape">Cancelar</button>
  `;
  abrirMiniModal(html);

  const lerDraftAtual = () => Array.from(document.querySelectorAll(".campo-rodape-input")).map(i => i.value);

  document.getElementById("btnCancelarRodape").addEventListener("click", fecharMiniModal);

  document.querySelectorAll(".remover-campo-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const atual = lerDraftAtual();
      atual.splice(Number(btn.dataset.idx), 1);
      abrirModalEditarRodape(atual);
    });
  });

  if (podeAdicionar) {
    document.getElementById("btnAdicionarCampoRodape").addEventListener("click", () => {
      const atual = lerDraftAtual();
      atual.push("");
      abrirModalEditarRodape(atual);
    });
  }

  document.getElementById("btnSalvarRodape").addEventListener("click", async () => {
    let novo = lerDraftAtual().map(v => v.trim()).filter(v => v !== "");
    if (novo.length === 0) novo = [""];
    configTexto.rodape = novo;
    await salvarConfigTexto();
    renderTextos();
    fecharMiniModal();
  });
}

document.getElementById("btnGerenciarLinks").addEventListener("click", e => {
  e.stopPropagation();
  renderConteudoLinks();
});

function renderConteudoLinks() {
  let linksHtml = links.map(l => `
    <div class="admin-row">
      <div class="admin-row-thumb admin-row-thumb-icon">${iconeHtml(l)}</div>
      <div class="admin-row-info">
        <p class="admin-row-title">${l.label}</p>
        <p class="admin-row-sub">${l.url}</p>
      </div>
      <div class="row-actions">
        <button class="icon-btn editar-link-btn" data-id="${l.id}" title="Editar" aria-label="Editar link">${svgLapis}</button>
        <button class="icon-btn perigo excluir-link-btn" data-id="${l.id}" title="Excluir" aria-label="Excluir link">${svgLixeira}</button>
      </div>
    </div>
  `).join("");

  if (links.length === 0) linksHtml = `<p class="admin-vazio">Nenhum link cadastrado.</p>`;

  const html = `
    <h3>Links úteis</h3>
    <div class="admin-list" style="margin-bottom:16px;">${linksHtml}</div>
    <button class="btn-novo" id="btnNovoLink">+ Novo link</button>
    <button class="btn-fechar-admin" id="btnFecharLinks">Fechar</button>
  `;
  abrirMiniModal(html);

  document.getElementById("btnFecharLinks").addEventListener("click", fecharMiniModal);
  document.getElementById("btnNovoLink").addEventListener("click", () => abrirModalFormLink(null));
  document.querySelectorAll(".editar-link-btn").forEach(btn => {
    btn.addEventListener("click", () => abrirModalFormLink(btn.dataset.id));
  });
  document.querySelectorAll(".excluir-link-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const link = links.find(l => l.id === btn.dataset.id);
      if (confirm(`Excluir o link "${link.label}"?`)) {
        const fotoAntiga = link.iconFoto;
        links = links.filter(l => l.id !== link.id);
        await salvarLinks();
        renderDock();
        renderConteudoLinks();
        removerFotoSilenciosamente(fotoAntiga);
      }
    });
  });
}

function abrirModalFormLink(id) {
  const link = id ? links.find(l => l.id === id) : null;
  const html = `
    <h3>${link ? "Editar link" : "Novo link"}</h3>
    <div class="field-group"><label>NOME DO LINK</label><input type="text" id="linkLabel" value="${link ? link.label.replace(/"/g, '&quot;') : ''}" placeholder="Ex: WhatsApp"></div>
    <div class="field-group"><label>URL</label><input type="text" id="linkUrl" value="${link ? link.url.replace(/"/g, '&quot;') : ''}" placeholder="https://..."></div>
    <div class="field-group">
      <label>ÍCONE</label>
      <select id="linkIcone">
        <option value="whatsapp">WhatsApp</option>
        <option value="agendar">Agenda</option>
        <option value="endereco">Endereço</option>
        <option value="instagram">Instagram</option>
        <option value="generico">Genérico</option>
        <option value="custom">Foto personalizada</option>
      </select>
    </div>
    <div class="field-group" id="linkIconeFotoGroup" style="display:none;">
      <label>FOTO DO ÍCONE</label>
      <input type="file" id="linkIconeFoto" accept="image/*">
      ${link && link.icon === "custom" && link.iconFoto ? `<div class="icone-preview"><img src="${link.iconFoto}" alt=""></div>` : ''}
    </div>
    <div class="erro-msg" id="erroLinkForm">Preencha nome e URL.</div>
    <button class="btn-salvar" id="btnSalvarLink">SALVAR LINK</button>
    <button class="btn-fechar-admin" id="btnVoltarLinks">Voltar</button>
  `;
  abrirMiniModal(html);
  const selectIcone = document.getElementById("linkIcone");
  const grupoFoto = document.getElementById("linkIconeFotoGroup");
  selectIcone.value = link ? link.icon : "generico";
  grupoFoto.style.display = selectIcone.value === "custom" ? "block" : "none";
  selectIcone.addEventListener("change", () => {
    grupoFoto.style.display = selectIcone.value === "custom" ? "block" : "none";
  });

  document.getElementById("btnVoltarLinks").addEventListener("click", renderConteudoLinks);
  document.getElementById("btnSalvarLink").addEventListener("click", async () => {
    const label = document.getElementById("linkLabel").value.trim();
    const url = document.getElementById("linkUrl").value.trim();
    const icon = selectIcone.value;
    const file = document.getElementById("linkIconeFoto").files[0];
    const erro = document.getElementById("erroLinkForm");
    const btnSalvar = document.getElementById("btnSalvarLink");

    if (!label || !url) {
      erro.textContent = "Preencha nome e URL.";
      erro.style.display = "block";
      return;
    }
    if (icon === "custom" && !file && !(link && link.iconFoto)) {
      erro.textContent = "Escolha uma foto para o ícone.";
      erro.style.display = "block";
      return;
    }
    erro.style.display = "none";
    btnSalvar.disabled = true;
    if (file) btnSalvar.textContent = "ENVIANDO...";

    try {
      let iconFotoUrl = link ? link.iconFoto || null : null;
      if (icon === "custom" && file) {
        iconFotoUrl = await subirFoto(file, `links/${uid()}.jpg`);
      }
      if (link) {
        link.label = label; link.url = url; link.icon = icon;
        if (icon === "custom") link.iconFoto = iconFotoUrl;
      } else {
        links.push({ id: uid(), label, url, icon, iconFoto: icon === "custom" ? iconFotoUrl : null });
      }
      await salvarLinks();
      renderDock();
      renderConteudoLinks();
    } catch (e) {
      console.error(e);
      erro.textContent = "Erro ao salvar. Tente novamente.";
      erro.style.display = "block";
      btnSalvar.disabled = false;
      btnSalvar.textContent = "SALVAR LINK";
    }
  });
}
